name: 영재컴퓨터 PC 자동 크롤링

on:
  schedule:
    - cron: '0 18 * * *'   # 매일 새벽 3:00 KST (= 18:00 UTC)
    - cron: '0 6 * * *'    # 매일 오후 3:00 KST (= 06:00 UTC)
  workflow_dispatch:         # 수동 실행 (테스트용)

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 크롤링 실행
        run: node crawl.js
